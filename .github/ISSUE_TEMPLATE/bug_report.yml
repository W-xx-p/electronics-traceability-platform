name: Bug report
description: 报告可复现的软件缺陷；安全问题请勿使用此模板。
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这不是安全漏洞，也没有包含真实生产数据或密钥。
          required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 请说明预期行为和实际行为。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    attributes:
      label: 版本与环境
      placeholder: v1.0.0 / Python 3.12 / Windows or Linux
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏日志
      description: 不要粘贴账号、令牌、序列号、标签原图或企业信息。
