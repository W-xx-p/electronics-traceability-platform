[project]
name = "electrotrace"
version = "1.0.0"
description = "Electronic product serial-number inspection and quality traceability platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "httpx>=0.27",
  "coverage[toml]>=7.6",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "pip-audit>=2.7",
]
# Install PaddleOCR separately in a compatible Python 3.11 environment.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*", "frontend*", "docs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["backend.app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
